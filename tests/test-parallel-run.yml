name: Test parallel k6 run
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install k6
        run: |
          K6_VERSION="v0.57.0"
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      - id: action
        uses: .
        with:
          path: tests/fixtures/k6/*.js
          parallel: "true"
          only-verify-scripts: "true"
          disable-analytics: "true"

      - name: Assert parallel verify succeeded
        run: |
          echo "Parallel k6 script verification completed successfully"
          echo "PASS"
