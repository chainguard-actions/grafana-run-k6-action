name: Test action fails when a k6 test fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install k6
        run: |
          set -e
          case "$(uname -m)" in
            x86_64) ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "unsupported arch"; exit 1 ;;
          esac
          V=v1.0.0
          curl -sSfL -o /tmp/k6.tgz "https://github.com/grafana/k6/releases/download/$V/k6-$V-linux-$ARCH.tar.gz"
          tar -xzf /tmp/k6.tgz -C /tmp
          mkdir -p "$HOME/k6bin"
          mv "/tmp/k6-$V-linux-$ARCH/k6" "$HOME/k6bin/k6"
          echo "$HOME/k6bin" >> "$GITHUB_PATH"
          "$HOME/k6bin/k6" version
          rm -f "$GITHUB_WORKSPACE"/k6-result-*.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/k6-fail/fail-threshold.js
          disable-analytics: "true"
      - name: Assert action failed after running the test
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure due to crossed threshold"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/k6-result-fail-threshold.txt" ]; then
            echo "FAIL: failing test was not actually executed"
            exit 1
          fi
          echo "PASS"
